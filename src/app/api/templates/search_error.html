{% extends "base.html" %}

{% block title %}Error - pgvector RAG{% endblock %}

{% block css %}
<style>
{% raw %}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    max-width: 600px;
    margin: 100px auto;
    padding: 20px;
    text-align: center;
}
.error {
    background: #ffebee;
    padding: 30px;
    border-radius: 12px;
    border-left: 5px solid #f44336;
    white-space: pre-wrap;
    word-wrap: break-word;
    text-align: left;
}
button {
    background: linear-gradient(135deg, #007bff, #0056b3);
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 20px;
}
{% endraw %}
</style>
{% endblock %}

{% block content %}
<div class="error">
    <h2> Search Failed</h2>
    <p>Sorry, there was an error processing your query:</p>
    <p><em>{{ error_message }}</em></p>
    <a href="/"><button>← Back to Search</button></a>
</div>
{% endblock %}
