services:
  # ============================================
  # PostgreSQL Database with Extensions
  # ============================================
  postgres:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile.postgres
      cache_from:
        - rag_postgres:latest
    image: rag_postgres:latest
    container_name: rag_postgres
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Initialization scripts (migrations)
      - ./deploy/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis (Celery Broker/Backend)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    ports:
      - "6379:6379"
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # RAG Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile
      cache_from:
        - rag_with_llama:latest
    image: rag_with_llama:latest
    container_name: rag_app
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-rag_db}

      # Ollama (runs on Windows host, accessible via host.docker.internal)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3.5:0.8b}

      # API Keys
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOGFIRE_WRITE_TOKEN: ${LOGFIRE_WRITE_TOKEN:-}
      LOGFIRE_READ_TOKEN: ${LOGFIRE_READ_TOKEN:-}

      # LLM
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # Langfuse observability (optional — leave blank to disable)
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Celery broker/backend + optional FE password
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}

      # Ingestion settings
      INPUT_RAW_DIR: ${INPUT_RAW_DIR:-input/raw}
      PARSED_DIR: ${PARSED_DIR:-data/parsed}
      CHUNKS_DIR: ${CHUNKS_DIR:-data/chunks}
      PERSIST_INGESTION_ARTIFACTS: ${PERSIST_INGESTION_ARTIFACTS:-true}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-2}
      INGESTION_CLAIM_TIMEOUT_MINUTES: ${INGESTION_CLAIM_TIMEOUT_MINUTES:-30}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      DEFAULT_PARSE_BACKEND: ${DEFAULT_PARSE_BACKEND:-ollama}
    ports:
      - "8000:8000"
    volumes:
      # Mount code for development (hot reload)
      - .:/app
      # Logs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================
  # Celery Worker - Upload queue (single worker)
  # Serves interactive uploads from the UI, kept separate from the
  # ingestion queue so a long directory scan cannot starve them.
  # ============================================
  celery_worker_upload:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile
      cache_from:
        - rag_with_llama:latest
    image: rag_with_llama:latest
    container_name: rag_celery_worker_upload
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: celery -A app.worker.celery_app worker -Q upload --loglevel=info -c 1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-rag_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3.5:0.8b}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INPUT_RAW_DIR: ${INPUT_RAW_DIR:-input/raw}
      PARSED_DIR: ${PARSED_DIR:-data/parsed}
      CHUNKS_DIR: ${CHUNKS_DIR:-data/chunks}
      PERSIST_INGESTION_ARTIFACTS: ${PERSIST_INGESTION_ARTIFACTS:-true}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-2}
      INGESTION_CLAIM_TIMEOUT_MINUTES: ${INGESTION_CLAIM_TIMEOUT_MINUTES:-30}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      DEFAULT_PARSE_BACKEND: ${DEFAULT_PARSE_BACKEND:-ollama}
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Celery Worker - Ingestion queue (scale to 2)
  # Scale with: docker compose up --scale celery_worker_ingestion=2
  # ============================================
  celery_worker_ingestion:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile
      cache_from:
        - rag_with_llama:latest
    image: rag_with_llama:latest
    container_name: rag_celery_worker_ingestion
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: celery -A app.worker.celery_app worker -Q ingestion --loglevel=info -c 1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-rag_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3.5:0.8b}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INPUT_RAW_DIR: ${INPUT_RAW_DIR:-input/raw}
      PARSED_DIR: ${PARSED_DIR:-data/parsed}
      CHUNKS_DIR: ${CHUNKS_DIR:-data/chunks}
      PERSIST_INGESTION_ARTIFACTS: ${PERSIST_INGESTION_ARTIFACTS:-true}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-2}
      INGESTION_CLAIM_TIMEOUT_MINUTES: ${INGESTION_CLAIM_TIMEOUT_MINUTES:-30}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      DEFAULT_PARSE_BACKEND: ${DEFAULT_PARSE_BACKEND:-ollama}
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Celery Beat - Scheduler
  # ============================================
  celery_beat:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile
      cache_from:
        - rag_with_llama:latest
    image: rag_with_llama:latest
    container_name: rag_celery_beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-rag_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3.5:0.8b}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INPUT_RAW_DIR: ${INPUT_RAW_DIR:-input/raw}
      PARSED_DIR: ${PARSED_DIR:-data/parsed}
      CHUNKS_DIR: ${CHUNKS_DIR:-data/chunks}
      PERSIST_INGESTION_ARTIFACTS: ${PERSIST_INGESTION_ARTIFACTS:-true}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-2}
      INGESTION_CLAIM_TIMEOUT_MINUTES: ${INGESTION_CLAIM_TIMEOUT_MINUTES:-30}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      DEFAULT_PARSE_BACKEND: ${DEFAULT_PARSE_BACKEND:-ollama}
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Langfuse (Optional - LLM Observability UI)
  # Start with: docker compose --profile observability up langfuse
  # UI at: http://localhost:3000
  # ============================================
  langfuse:
    image: langfuse/langfuse:2.80
    container_name: rag_langfuse
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/langfuse_db
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-use-a-real-secret-in-prod}
      SALT: ${LANGFUSE_SALT:-changeme-use-a-real-salt-in-prod}
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-rag-org}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-rag-project}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-lf-pk-placeholder}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-lf-sk-placeholder}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # pgAdmin (Optional - Database Management UI)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: rag_pgadmin
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - rag_network
    restart: unless-stopped
    profiles:
      - dev  # Only start with: docker-compose --profile dev up

  # ============================================
  # Test Runner Service
  # ============================================
  test:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile.test
    image: rag_with_llama:test
    container_name: rag_test
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Database connection (use service name 'postgres')
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # API Keys
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOGFIRE_WRITE_TOKEN: ${LOGFIRE_WRITE_TOKEN:-}
      LOGFIRE_READ_TOKEN: ${LOGFIRE_READ_TOKEN:-}

      # LLM Configuration
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # Test environment
      PYTHONPATH: /app
    volumes:
      # Mount tests directory for easier test development
      - ./tests:/app/tests
      # Mount htmlcov for coverage reports
      - ./htmlcov:/app/htmlcov
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_network
    profiles:
      - test  # Only start with: docker-compose --profile test up

# ============================================
# Networks
# ============================================
networks:
  rag_network:
    driver: bridge

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
