services:
  # ============================================
  # PostgreSQL Database with Extensions
  # ============================================
  postgres:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile.postgres
      cache_from:
        - rag_postgres:latest
    image: rag_postgres:latest
    container_name: rag_postgres
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Initialization scripts (migrations)
      - ./deploy/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis (Celery Broker/Backend)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    ports:
      - "6379:6379"
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # RAG Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile
      cache_from:
        - rag_with_llama:latest
    image: rag_with_llama:latest
    container_name: rag_app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-rag_db}

      # Ollama (runs on Windows host, accessible via host.docker.internal)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3.5:0.8b}

      # API Keys
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOGFIRE_WRITE_TOKEN: ${LOGFIRE_WRITE_TOKEN:-}
      LOGFIRE_READ_TOKEN: ${LOGFIRE_READ_TOKEN:-}

      # LLM
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # Langfuse observability (optional — leave blank to disable)
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Celery broker/backend + optional FE password
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}

      # Ingestion settings
      INPUT_RAW_DIR: ${INPUT_RAW_DIR:-input/raw}
      PARSED_DIR: ${PARSED_DIR:-data/parsed}
      CHUNKS_DIR: ${CHUNKS_DIR:-data/chunks}
      PERSIST_INGESTION_ARTIFACTS: ${PERSIST_INGESTION_ARTIFACTS:-true}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-2}
      # 180, not 30: a 500-page parse runs ~60 minutes, and a shorter timeout
      # lets the 6-hourly recovery sweep declare a live parse stale, re-dispatch a
      # second conversion of the same document, and burn the retry budget.
      INGESTION_CLAIM_TIMEOUT_MINUTES: ${INGESTION_CLAIM_TIMEOUT_MINUTES:-180}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      DEFAULT_PARSE_BACKEND: ${DEFAULT_PARSE_BACKEND:-ollama}

      # PDF parse tuning. These defaults reproduce the previously hardcoded
      # values exactly; they are here so the CPU/thread and VLM-concurrency
      # experiments are env changes rather than code edits.
      # 4, targeting the M1's 4 performance cores, with slack left inside the
      # 4.0 CPU quota for the orchestrating thread and asyncpg — Docker enforces
      # --cpus as a CFS bandwidth quota, so saturating it throttles everything
      # else in the container rather than just failing to help.
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      DOCLING_PAGE_BATCH_SIZE: ${DOCLING_PAGE_BATCH_SIZE:-50}
      # 1, not 2: Ollama runs on the same host and serializes on one GPU.
      # Measured on an M1 — 3.87s/call at 1, 4.93s at 2, 20.62s at 4.
      VLM_CONCURRENCY: ${VLM_CONCURRENCY:-1}
      # qwen3.5 is a reasoning model and Ollama defaults thinking ON. Measured
      # on a real BERT table crop: 87.35s versus 2.27s, with the reasoning
      # discarded unread. Tables additionally returned empty every time.
      OLLAMA_VLM_THINK: ${OLLAMA_VLM_THINK:-false}
      # Tables go to docling's TableFormer. A 0.8B VLM cannot read them: on
      # bert.pdf the 13-column GLUE table came back with headers "I, II, III…"
      # and a small table came back with invented rows. Set true to restore the
      # old behaviour of routing complex tables to the VLM.
      VLM_TABLES: ${VLM_TABLES:-false}

      # The runtime image ships without a compiler by design, so a downstream
      # torch.compile path (torchvision NMS during docling's layout pass) dies
      # with InvalidCxxCompiler. Nothing here calls torch.compile, so forcing
      # eager execution costs nothing and removes the crash.
      TORCHDYNAMO_DISABLE: "1"
    ports:
      - "8000:8000"
    volumes:
      # Mount code for development (hot reload)
      - .:/app
      # Logs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================
  # Celery Worker - Upload queue (single worker)
  # Serves interactive uploads from the UI, kept separate from the
  # ingestion queue so a long directory scan cannot starve them.
  # ============================================
  celery_worker_upload:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile
      cache_from:
        - rag_with_llama:latest
    image: rag_with_llama:latest
    container_name: rag_celery_worker_upload
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2.5G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: celery -A app.worker.celery_app worker -Q upload --loglevel=info -c 1 --max-tasks-per-child=1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-rag_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3.5:0.8b}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INPUT_RAW_DIR: ${INPUT_RAW_DIR:-input/raw}
      PARSED_DIR: ${PARSED_DIR:-data/parsed}
      CHUNKS_DIR: ${CHUNKS_DIR:-data/chunks}
      PERSIST_INGESTION_ARTIFACTS: ${PERSIST_INGESTION_ARTIFACTS:-true}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-2}
      # 180, not 30: a 500-page parse runs ~60 minutes, and a shorter timeout
      # lets the 6-hourly recovery sweep declare a live parse stale, re-dispatch a
      # second conversion of the same document, and burn the retry budget.
      INGESTION_CLAIM_TIMEOUT_MINUTES: ${INGESTION_CLAIM_TIMEOUT_MINUTES:-180}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      DEFAULT_PARSE_BACKEND: ${DEFAULT_PARSE_BACKEND:-ollama}

      # PDF parse tuning. These defaults reproduce the previously hardcoded
      # values exactly; they are here so the CPU/thread and VLM-concurrency
      # experiments are env changes rather than code edits.
      # 4, targeting the M1's 4 performance cores, with slack left inside the
      # 4.0 CPU quota for the orchestrating thread and asyncpg — Docker enforces
      # --cpus as a CFS bandwidth quota, so saturating it throttles everything
      # else in the container rather than just failing to help.
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      DOCLING_PAGE_BATCH_SIZE: ${DOCLING_PAGE_BATCH_SIZE:-50}
      # 1, not 2: Ollama runs on the same host and serializes on one GPU.
      # Measured on an M1 — 3.87s/call at 1, 4.93s at 2, 20.62s at 4.
      VLM_CONCURRENCY: ${VLM_CONCURRENCY:-1}
