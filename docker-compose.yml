      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Langfuse (Optional - LLM Observability UI)
  # Start with: docker compose --profile observability up langfuse
  # UI at: http://localhost:3000
  # ============================================
  langfuse:
    image: langfuse/langfuse:2.80
    container_name: rag_langfuse
    profiles:
      - observability  # Only start with: docker compose --profile observability up
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/langfuse_db
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-use-a-real-secret-in-prod}
      SALT: ${LANGFUSE_SALT:-changeme-use-a-real-salt-in-prod}
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-rag-org}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-rag-project}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-lf-pk-placeholder}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-lf-sk-placeholder}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # pgAdmin (Optional - Database Management UI)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: rag_pgadmin
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - rag_network
    restart: unless-stopped
    profiles:
      - dev  # Only start with: docker-compose --profile dev up

  # ============================================
  # Test Runner Service
  # ============================================
  test:
    build:
      context: .
      dockerfile: deploy/deployment/Dockerfile.test
    image: rag_with_llama:test
    container_name: rag_test
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Database connection (use service name 'postgres')
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # API Keys
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOGFIRE_WRITE_TOKEN: ${LOGFIRE_WRITE_TOKEN:-}
      LOGFIRE_READ_TOKEN: ${LOGFIRE_READ_TOKEN:-}

      # LLM Configuration
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # Test environment
      PYTHONPATH: /app
    volumes:
      # Mount tests directory for easier test development
      - ./tests:/app/tests
      # Mount htmlcov for coverage reports
      - ./htmlcov:/app/htmlcov
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_network
    profiles:
      - test  # Only start with: docker-compose --profile test up

# ============================================
# Networks
# ============================================
networks:
  rag_network:
    driver: bridge

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  postgres_data:
