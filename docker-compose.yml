      # with InvalidCxxCompiler. Nothing here calls torch.compile, so forcing
      # eager execution costs nothing and removes the crash.
      TORCHDYNAMO_DISABLE: "1"
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_network
    restart: unless-stopped

  # ============================================
  # Celery Worker - Ingestion queue (scale to 2)
  # Scale with: docker compose up --scale celery_worker_ingestion=2
  # ============================================
  celery_worker_ingestion:
    build:
